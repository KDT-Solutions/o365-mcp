name: docker-publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: |
          python -m pip install -r requirements.lock pytest
          python -m pytest -q

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kdt-solutions/o365-mcp
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=ref,event=tag

      - id: info
        run: |
          echo "version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build image for test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: o365-mcp:test
          build-args: |
            APP_VERSION=${{ steps.info.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_DATE=${{ steps.info.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container smoke test
        run: |
          docker run --rm -i --read-only --tmpfs /tmp --tmpfs /home/mcp:uid=10001,gid=10001 \
            --tmpfs /data:uid=10001,gid=10001 o365-mcp:test python3 - < tests/container/smoke.py

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.info.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_DATE=${{ steps.info.outputs.date }}
          cache-from: type=gha
