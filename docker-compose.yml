# Portainer Git stack (Docker Standalone). The image is built by GitHub Actions
# on every push to main (.github/workflows/docker-publish.yml) and pulled from GHCR.
# Configuration comes from stack environment variables; no host files are needed.
services:
  o365-mcp:
    image: ghcr.io/kdt-solutions/o365-mcp:${O365_MCP_TAG:-latest}
    # Pull on every deploy/redeploy instead of reusing a stale local :latest.
    pull_policy: always
    container_name: o365-mcp-cloud
    restart: unless-stopped
    init: true
    # Hardening: unprivileged user (see Dockerfile), read-only root filesystem,
    # no Linux capabilities. security_opt is not set: Portainer rejects it for
    # non-admin users, and this stack is deployed by the MCP user.
    read_only: true
    cap_drop:
      - ALL
    environment:
      # JSON with client_id, tenants and bearer clients (see config/tenants.example.json).
      TENANTS_JSON: ${TENANTS_JSON:?Set TENANTS_JSON}
      STATE_PATH: /data/state.db
      MCP_PATH: ${MCP_PATH:-/o365}
      ALLOWED_HOSTS: ${MCP_PUBLIC_HOST:-mcp.example.com},localhost:*,127.0.0.1:*
      ALLOWED_ORIGINS: https://${MCP_PUBLIC_HOST:-mcp.example.com}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      EXCHANGE_MAX_SESSIONS: ${EXCHANGE_MAX_SESSIONS:-2}
      EXCHANGE_IDLE_SECONDS: ${EXCHANGE_IDLE_SECONDS:-600}
      HOME: /home/mcp
    ports:
      # Access only through the reverse proxy with TLS. Set MCP_BIND_ADDR to
      # the Docker host IP the proxy connects to; without it the service is
      # only reachable on 127.0.0.1.
      - "${MCP_BIND_ADDR:-127.0.0.1}:${MCP_HOST_PORT:-8437}:8000"
    volumes:
      # SQLite state, audit log and the generated app certificate.
      - data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=10001,gid=10001
      - /home/mcp:rw,nosuid,size=128m,uid=10001,gid=10001
    mem_limit: 2g
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
volumes:
  data:
